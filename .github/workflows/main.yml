name: IPTV Senderpruefung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: iptv-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Sender pruefen
        run: |
          python3 - <<'PY'
          import urllib.request
          import time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor

          source = Path("Deutsch_Russisch_IBO_optimiert.m3u")
          lines = source.read_text(encoding="utf-8-sig").splitlines()
          header = []
          sender = []
          block = []

          for line in lines:
              if line.startswith("#EXTINF:"):
                  if block:
                      sender.append(block)
                  block = [line]
              elif block:
                  block.append(line)
              else:
                  header.append(line)

          if block:
              sender.append(block)

          def check(item):
              urls = [
                  x.strip() for x in item
                  if x.strip().startswith(("http://", "https://"))
              ]
              for url in urls:
                  for attempt in range(3):
                      try:
                          req = urllib.request.Request(
                              url,
                              headers={"User-Agent": "VLC/3.0"}
                          )
                          with urllib.request.urlopen(req, timeout=10) as r:
                              data = r.read(4096)
                              if data and b"<html" not in data.lower() and b"<!doctype html" not in data.lower():
                                  return True, item
                      except Exception:
                          pass
                      if attempt < 2:
                          time.sleep(2)
              return False, item

          with ThreadPoolExecutor(max_workers=10) as pool:
              results = list(pool.map(check, sender))

          good = [item for ok, item in results if ok]
          bad = [item for ok, item in results if not ok]

          def save(filename, items):
              content = header.copy()
              for item in items:
                  content.extend(item)
              Path(filename).write_text(
                  "\n".join(content) + "\n",
                  encoding="utf-8"
              )

          save("Deutsch_Russisch_IBO_Nachpruefung.m3u", bad)

          if good:
              save("Deutsch_Russisch_IBO_geprueft.m3u", good)

          with open("Pruefbericht.txt", "w", encoding="utf-8") as f:
              f.write(f"Geprueft: {len(results)}\n")
              f.write(f"Erreichbar: {len(good)}\n")
              f.write(f"Nicht erreichbar: {len(bad)}\n\n")
              for ok, item in results:
                  status = "ERREICHBAR" if ok else "NICHT ERREICHBAR"
                  f.write(f"{status}: {item[0]}\n")

          print(f"Erreichbar: {len(good)}")
          print(f"Nicht erreichbar: {len(bad)}")
          PY

      - name: Pruefbericht speichern
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Pruefbericht
          path: Pruefbericht.txt

      - name: Playlisten aktualisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deutsch_Russisch_IBO_*.m3u
          git add Pruefbericht.txt
          if ! git diff --cached --quiet; then
            git commit -m "Automatische IPTV Aktualisierung"
            git push
          fi
