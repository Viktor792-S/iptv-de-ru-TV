name: IPTV Senderpruefung

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Sender pruefen
        run: |
          python3 - <<'PY'
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          datei = "Deutsch_Russisch_IBO_optimiert.m3u"
          sender = []
          name = ""

          with open(datei, encoding="utf-8-sig") as f:
              for line in f:
                  line = line.strip()
                  if line.startswith("#EXTINF"):
                      name = line.split(",")[-1]
                  elif line.startswith(("http://", "https://")):
                      sender.append((name, line))

          def check(item):
              name, url = item
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "VLC/3.0"}
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = r.read(1024)
                      if data and b"<html" not in data.lower():
                          return True, name
              except Exception:
                  pass
              return False, name

          with ThreadPoolExecutor(max_workers=10) as pool:
              results = list(pool.map(check, sender))

          with open("Pruefbericht.txt", "w", encoding="utf-8") as f:
              f.write(f"Geprueft: {len(results)}\n")
              f.write(f"Erreichbar: {sum(ok for ok, _ in results)}\n\n")
              for ok, name in results:
                  status = "ERREICHBAR" if ok else "NICHT ERREICHBAR"
                  f.write(f"{status}: {name}\n")
          PY

      - name: Pruefbericht speichern
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Pruefbericht
          path: Pruefbericht.txt
